# Site settings
locale: "en-US"
site_theme: "default"
title: "Junjia QI"
title_separator: "-"
name: &name "Junjia QI"
description: &description "Academic homepage of Junjia QI"
url: "https://qi202.github.io"
baseurl: ""
repository: "Qi202/qi202.github.io"

author:
  avatar: "profile.jpg"
  name: "Junjia QI"
  pronouns:
  bio: "M.Sc. Student in Data Science at CityU"
  location: "Hong Kong SAR"
  employer: "City University of Hong Kong"
  uri:
  email: "junjiaqi2-c@my.cityu.edu.hk"
  academia:
  arxiv:
  googlescholar: "https://scholar.google.com/citations?hl=en&user=vuviavMAAAAJ"
  inspire-hep:
  impactstory:
  orcid:
  semantic:
  pubmed:
  researchgate:
  scopus:
  bitbucket:
  codepen:
  dribbble:
  github: "Qi202"
  kaggle:
  stackoverflow:
  artstation:
  bluesky:
  facebook:
  flickr:
  foursquare:
  goodreads:
  google_plus:
  keybase:
  instagram:
  lastfm:
  linkedin:
  mastodon:
  medium:
  pinterest:
  soundcloud:
  steam:
  telegram:
  tumblr:
  twitter:
  vine:
  weibo:
  wikipedia:
  xing:
  youtube:
  zhihu:

publication_category:
  workshops:
    title: "Workshop Papers"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider:

atom_feed:
  hide: true

social:
  type: Person
  name: Junjia QI
  links:
    - "https://scholar.google.com/citations?hl=en&user=vuviavMAAAAJ"
    - "https://github.com/Qi202"

analytics:
  provider: false

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
